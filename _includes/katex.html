{%- comment -%}
  Typesets record titles that carry TeX. Each <span class="tex" data-tex="...">
  shows the plain-text title until KaTeX loads, then is replaced by the
  typeset TeX. Loaded only on pages with `katex: true`.
{%- endcomment -%}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (!window.renderMathInElement) return;
    document.querySelectorAll(".tex[data-tex]").forEach(function (el) {
      el.textContent = el.dataset.tex;
      renderMathInElement(el, {
        delimiters: [{left: "$", right: "$", display: false}, {left: "\\(", right: "\\)", display: false}],
        throwOnError: false
      });
    });
  });
</script>
