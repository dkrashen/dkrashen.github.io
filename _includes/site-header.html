<header class="site-header">
  <div class="frame site-header__inner">
    <a class="site-header__brand" href="/">torsor.org</a>
    <nav class="site-nav" aria-label="site">
      {%- for item in site.data.nav -%}
        <a href="{{ item.url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
